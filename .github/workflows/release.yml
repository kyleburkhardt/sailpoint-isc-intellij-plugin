name: Release

# Push a tag like v0.1.1 (matching pluginVersion in gradle.properties) to publish that version:
# the zip goes on a GitHub Release, and the update feed on GitHub Pages points IDEs at it.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          version=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pluginVersion=$version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the plugin and its update feed
        run: ./gradlew test buildPlugin updatePluginsXml

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --title "$GITHUB_REF_NAME" --generate-notes

      - name: Prepare the update feed site
        run: |
          mkdir site
          cp build/distributions/updatePlugins.xml site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}updatePlugins.xml
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
