pluginVersion=0.1.0
platformVersion=2026.2.3
# Kotlin used to build the plugin (the CodeQL workflow overrides it; see settings.gradle.kts).
kotlinVersion=2.4.20
pluginSinceBuild=262
# Where tagged releases attach the plugin zip; the update feed links to <this>/v<version>/<zip>.
pluginReleaseUrl=https://github.com/kyleburkhardt/sailpoint-isc-intellij-plugin/releases/download

# Room for the Kotlin compiler when it runs inside Gradle, as the CodeQL workflow requires.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# The IDE provides the Kotlin stdlib at runtime; don't bundle our own copy.
kotlin.stdlib.default.dependency=false
